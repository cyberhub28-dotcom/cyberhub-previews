top:
  kicker: Privacy
  headline: How this site handles your information.
body: '<h2>What we collect</h2>

  <p>This site doesn''t store what you type. The contact form opens your own email app, and nothing reaches the club until you press Send. We use your message to reply to you and run club programs. Athlete registration and the sign-up fee are handled on the club''s Zeffy page. Volunteers sign up on the club''s Google Form, and donations are made on Zeffy. Those services'' own privacy policies also apply, including to payment details you enter on Zeffy.</p>

  <h2>Sign-ups</h2>

  <p>Parents and guardians register athletes and pay on the club''s Zeffy page. Volunteers sign up on the club''s Google Form. These forms are for parents, guardians and adult volunteers. Children should not fill them out.</p>

  <ul>

  <li>What the forms ask: The athlete sign-up on Zeffy asks the parent or guardian for their name, email, phone number, state and country. For each athlete, it asks for the athlete''s name, age, gender and jersey size, and any needs the family wants coaches to know about. Payment is handled by Zeffy. The volunteer form on Google Forms asks for your name, phone number and email, whether you''re 18 or older, which roles and times you''d like, your T-shirt size, any experience with children or adaptive sports, whether you agree to a background check, your agreement to the volunteer code of conduct, and whether your photo may be used on the club''s website and social media.</li>

  <li>Athlete needs: Only share what helps coaches keep your athlete safe and included. You don''t need to give a diagnosis or medical records. Only To confirm: who at the club can see these answers</li>

  <li>Background checks: To confirm: who runs the volunteer background checks</li>

  <li>Who sees it: To confirm: who at the club can see answers</li>

  <li>Where it''s kept and for how long: To confirm: where answers are kept and when they''re deleted</li>

  </ul>

  <p>Zeffy and Google store the answers under their own privacy policies: <a href="https://support.zeffy.com/privacy-policy-6d7zh">Zeffy''s privacy policy</a> and <a href="https://policies.google.com/privacy">Google''s privacy policy</a>.</p>

  <h2>Children</h2>

  <p>This website itself doesn''t ask for information about children. When a parent or guardian registers an athlete on the club''s Zeffy page, the club receives the athlete''s details that form asks for. The club uses them only to run its programs and keep athletes safe. To see, correct or remove an athlete''s details, a parent or guardian can contact the club.</p>

  <p>Please don''t send medical records through the site.</p>

  <p>This site is for parents and adults. We don''t knowingly collect information from children under 13.</p>

  <h2>Photos</h2>

  <p>Photos of children appear only with a parent''s signed permission. To have a photo taken down, email the club and it comes down within 48 hours.</p>

  <h2>Donations</h2>

  <p>Gifts are made on the club''s Zeffy page. Zeffy''s own privacy policy covers what you enter there.</p>

  <h2>What we don''t do</h2>

  <p>We don''t sell personal information, and this site doesn''t run advertising cookies.</p>

  <h2>Facebook</h2>

  <p>Links to the club''s Facebook page open Facebook, and Facebook''s own privacy policy applies there. This site doesn''t load Facebook on its own pages.</p>

  <h2>Where this site lives</h2>

  <p>This site is hosted on GitHub Pages, and GitHub''s own privacy statement covers the basic visit logs it keeps. The site''s fonts load from this site, not from Google.</p>

  <h2>Your information</h2>

  <p>To see or delete information you''ve sent the club, email To confirm: club email for privacy requests.</p>'
