top:
  kicker: Privacy
  headline: How this site handles your information.
body: '<h2>What we collect</h2>

  <p>This site doesn''t store what you type. The contact form opens your own email app, and nothing reaches the club until you press Send. We use your message to reply to you and run club programs. Athlete registration happens on the club''s Google Form, and gifts are made on Zeffy. Those services'' own privacy policies also apply.</p>

  <h2>Sign-ups</h2>

  <p>Volunteers sign up on the club''s Google Form. Parents and guardians register athletes on the club''s Google Form too.</p>

  <ul>

  <li>What the form asks: To confirm: the questions on the club''s form</li>

  <li>Who sees it: To confirm: who at the club can see answers</li>

  <li>Where it''s kept and for how long: To confirm: where answers are kept and when they''re deleted</li>

  </ul>

  <h2>Children</h2>

  <p>A parent, guardian or adult volunteer fills in every form. Forms on this site don''t ask for details about children. Please don''t send medical records through the site.</p>

  <p>This site is for parents and adults. We don''t knowingly collect information from children under 13.</p>

  <h2>Photos</h2>

  <p>Photos of children appear only with a parent''s signed permission. To have a photo taken down, email the club and it comes down within 48 hours.</p>

  <h2>Donations</h2>

  <p>Gifts are made on the club''s Zeffy page. Zeffy''s own privacy policy covers what you enter there.</p>

  <h2>What we don''t do</h2>

  <p>We don''t sell personal information, and this site doesn''t run advertising cookies.</p>

  <h2>Facebook</h2>

  <p>Links to the club''s Facebook page open Facebook, and Facebook''s own privacy policy applies there. This site doesn''t load Facebook on its own pages.</p>

  <h2>Where this site lives</h2>

  <p>This site is hosted on GitHub Pages, and GitHub''s own privacy statement covers the basic visit logs it keeps. The site''s fonts load from this site, not from Google.</p>

  <h2>Your information</h2>

  <p>To see or delete information you''ve sent the club, email To confirm: club email for privacy requests.</p>'
