# All Abilities Sports Club preview: faq. Edited in Pages CMS.
- question: What is Winter Indoor Soccer?
  answer: "<p>An indoor soccer season for children of all abilities. It runs six Sundays, from January 10 to February 14, 2027.</p>"
  coming_soon: false
- question: When does registration open and close?
  answer: "<p>Registration opens November 20, 2026. It closes December 18, 2026, or sooner if all 48 spots are filled.</p>"
