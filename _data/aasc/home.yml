# All Abilities Sports Club preview: home. Edited in Pages CMS.
hero_text: "Inclusive youth sports for children of all abilities in the Dayton, Ohio area. Soccer comes first, with basketball, baseball and flag football to follow. No experience needed."
story_photo: ''
story_photo_description: ''
story_heading: It started with a team for Bennett.
quote: "As parents to a child with autism, we understand firsthand how difficult it can be to find recreational opportunities where children with different abilities feel truly welcomed, supported, and included. What began as a desire to create a place where our son Bennett could create the same friendships our older daughter experiences within her club sports has grown into a mission to provide those same opportunities to other families in our community."
quote_highlight: "What began as a desire to create a place where our son Bennett could create the same friendships our older daughter experiences within her club sports"
quote_by: Amber Davidson, Founder
events_heading: Come say hello.
events_intro: Meet the club, bring the kids to play, and hear what's coming next.
faq_heading: Good to know before you sign up.
faq_intro: "Quick answers about Winter Indoor Soccer. Can't find yours? Email the club and Amber will get back to you."
join_heading: There's a place on the field for you.
join_intro: "Sign up an athlete, lend a hand on game day, or help another family say yes."
