story:
  kicker: Why we started
  heading: It started with a team for Bennett.
  photo: ''
  photo_description: ''
  quote: As parents to a child with autism, we understand firsthand how difficult it can be to find recreational opportunities where children with different abilities feel truly welcomed, supported, and included. What began as a desire to create a place where our son Bennett could create the same friendships our older daughter experiences within her club sports has grown into a mission to provide those same opportunities to other families in our community.
  quote_highlight: What began as a desire to create a place where our son Bennett could create the same friendships our older daughter experiences within her club sports
  quote_by: Amber Davidson, Founder
