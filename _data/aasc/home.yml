faq:
  kicker: Parent questions
  heading: Good to know before you sign up.
  intro: Quick answers for families. Can't find yours? Email the club and Amber will get back to you.
  button: Ask a question
  soon_tag: Coming soon
  questions:
  - question: How do I register my child?
    answer: <p>A parent or guardian registers each athlete on the club's online registration form. The link goes live on the <a href="get-involved.html">sign-up page</a> when registration opens.</p>
    coming_soon: false
  - question: What ages can play?
    answer: '<p>Children from age 3 can play. If your child is a little younger and ready to join in, they''re welcome too. <span class="ph">To confirm: top age</span></p>'
    coming_soon: false
  - question: Does my child need any experience?
    answer: <p>No. No experience is needed.</p>
    coming_soon: false
  - question: Can I help without signing up an athlete?
    answer: <p>Yes. You can <a href="get-involved.html#volunteer">volunteer</a> as a coach, a buddy or an event-day helper, or <a href="donate.html">support the club</a> with a gift.</p>
    coming_soon: false
  - question: Who do I contact with a question?
    answer: <p>Email Amber Davidson, the club's founder, at <a href="mailto:amber.davidson@allabilitiessportsclub.com">amber.davidson@allabilitiessportsclub.com</a>.</p>
    coming_soon: false
