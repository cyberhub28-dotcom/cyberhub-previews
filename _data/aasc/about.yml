why_heading: Why we started
why_text: <p>As parents to a child with autism, we understand firsthand how difficult it can be to find recreational opportunities where children with different abilities feel truly welcomed, supported, and included. What began as a desire to create a place where our son Bennett could create the same friendships our older daughter experiences within her club sports has grown into a mission to provide those same opportunities to other families in our community.</p>
bennett_heading: Bennett's story
bennett_story: '<p>Bennett was diagnosed with Level 2 autism at just two-and-a-half years old, and by that time, we had already entered a world of therapies, visual schedules, and learning to decipher his sensory needs. If you know Bennett, then you know he has every person he meets wrapped around his finger. He has a contagious laugh and smile, you just can''t help but love our four-wheeler-loving, McDonald’s-obsessed, thrill-seeking, handsome boy. We quickly realized that while we did not want to force Bennett into a traditional, neurotypical mold, we could do our best to create an environment where he would thrive, and that became the mission behind <strong>All Abilities Sports Club</strong>. After years of paving a predictable, supportive path for Bennett at home and school, we wanted to create that same opportunity for other families in the community to come together: a recreational sports club where kids with disabilities and other support needs aren''t expected to fit the game, because this game is built to fit them.</p>'
what_heading: What the club does
what_we_do: <p>All Abilities Sports Club is a nonprofit organization dedicated to providing inclusive sports opportunities for children of all abilities in the Dayton, Ohio area. Through adaptive programming, supportive coaching and a welcoming community, we help every child build confidence, friendships and a lifelong love of sports.</p>
