- name: aasc-gallery
  label: Gallery page and photos
  type: file
  path: _data/aasc/gallery.yml
  format: yaml
  fields:
  - name: kicker
    label: Small label above the headline
    type: string
  - name: headline
    label: Headline
    type: string
  - name: intro
    label: Intro line
    type: text
  - name: pick_heading
    label: Heading above the photo groups
    type: string
  - name: has_photos_line
    label: Line when there are photos
    type: string
  - name: no_photos_line
    label: Line when there are no photos yet
    type: string
  - name: coming_soon
    label: Words on a group with no photos
    type: string
  - name: season_tag
    label: Tag on the big card
    type: string
    description: Shows on the big card when it is the sport set to This season under Sports.
  - name: photo_word
    label: Word after the count for 1 photo
    type: string
  - name: photos_word
    label: Word after the count for more photos
    type: string
    description: 'Photo groups (just below): Each group is one card on the Gallery page, like a sport, Buddies or Game Day. Add, remove or drag to reorder. The first group that has photos gets the big card on top. Only add photos of children after a parent or guardian signs the photo release.'
  - name: groups
    label: Photo groups
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Group name
      type: string
      required: true
    - name: picture
      label: Drawing
      type: select
      required: true
      default: Cheering kids
      description: 'Which drawing and colors the card uses. Photos (just below): Add as many as you like. Drag to change the order they open in.'
      options:
        values:
        - Soccer
        - Basketball
        - Baseball
        - Flag football
        - Buddies
        - Cheering kids
    - name: photos
      label: Photos
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{description}'
      fields:
      - name: photo
        label: Photo
        type: image
        required: true
      - name: description
        label: Photo description
        type: string
        required: true
        description: A short description of what's in the photo, read out by screen readers. For example "Two players high-five after a goal." First names only.
      - name: caption
        label: Caption
        type: string
        description: Optional. A few words shown under the photo when it's open.
  - name: page
    label: Browser tab and Google
    type: object
    description: The words in the browser tab, and the short summary Google and Facebook show when the page is shared.
    fields:
    - name: tab_title
      label: Browser tab title
      type: string
      description: 'For example: Gallery | All Abilities Sports Club'
    - name: description
      label: Short summary for Google and sharing
      type: text
      description: One or two sentences. Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
