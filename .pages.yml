- name: aasc-site
  label: Whole site
  type: file
  path: _data/aasc/site.yml
  format: yaml
  fields:
  - name: club
    label: Club details and links
    type: object
    description: Email, contact name and the links behind the Donate and Volunteer buttons. Each sport's sign-up link is on the Programs page.
    fields:
    - name: email
      label: Club email
      type: string
      description: Shown on the Contact page. Messages from the site forms go here.
      required: true
    - name: contact_person
      label: Contact name
      type: string
      description: Shown on the Contact page, under "Email the club".
    - name: area_line
      label: Area line
      type: string
      description: Shown on the Contact page.
    - name: footer_about
      label: Footer sentence
      type: text
      description: The short line under the logo at the bottom of every page.
    - name: facebook
      label: Facebook page link
      type: string
      required: true
      pattern:
        regex: ^https://\S+$
        message: Paste the full link, starting with https://
      description: The club's Facebook page. Paste the full link, starting with https://.
    - name: donate_link
      label: Donate button link
      type: string
      description: Where the Donate on Zeffy button goes.
      required: true
      pattern:
        regex: ^https://\S+$
        message: Paste the full link, starting with https://
    - name: volunteer_form
      label: Volunteer form link
      type: string
      description: The online form volunteers fill in. Leave empty until it's ready, and the Volunteer now button stays switched off.
      pattern:
        regex: ^(https://\S+)?$
        message: Paste the full link, starting with https://, or leave it empty
  - name: menu
