# Pages CMS setup (https://pagescms.org). Lets you edit site content with simple forms.
# Each entry below shows up in the Pages CMS sidebar. The All Abilities entries edit the
# files in _data/aasc (and the events file); GitHub Pages builds the pages from them.
media:
  input: all-abilities-claude/images
  output: /all-abilities-claude/images
  categories:
  - image
content:
- name: aasc-club
  label: 'All Abilities: Club details and links'
  type: file
  path: _data/aasc/club.yml
  format: yaml
  fields:
  - name: email
    label: Club email
    type: string
    description: Shown on the Contact page. Messages from the site forms go here.
    required: true
  - name: contact_person
    label: Contact name
    type: string
    description: Shown on the Contact page, under "Email the club".
  - name: area_line
    label: Area line
    type: string
    description: Shown on the Contact page.
  - name: footer_about
    label: Footer sentence
    type: text
    description: The short line under the logo at the bottom of every page.
  - name: facebook
    label: Facebook page link
    type: string
    required: true
    pattern: &id001
      regex: ^https://\S+$
      message: Paste the full link, starting with https://
  - name: donate_link
    label: Donate button link
    type: string
    description: Where the Donate on Zeffy button goes.
    required: true
    pattern: *id001
  - name: registration_form
    label: Registration link
    type: string
    description: Where families sign up. This can be a Google Form or a Zeffy registration page. Every Register now button uses it. Leave empty until it's ready, and the button stays switched off.
    pattern: &id002
      regex: ^(https://\S+)?$
      message: Paste the full link, starting with https://, or leave it empty
  - name: payment_link
    label: Payment link (optional)
    type: string
    description: Only if families pay the fee on a separate page, like a Zeffy payment page. When it's filled in, a Pay the fee button shows next to Register now. Leave empty if payment is part of the registration
      form.
    pattern:
      regex: ^(https://\S+)?$
      message: Paste the full link, starting with https://, or leave it empty
  - name: volunteer_form
    label: Volunteer form link
    type: string
    description: The online form volunteers fill in. Leave empty until it's ready, and the Volunteer now button stays switched off.
    pattern: *id002
- name: aasc-season
  label: 'All Abilities: Current season'
  type: file
  path: _data/aasc/season.yml
  format: yaml
  fields:
  - name: name
    label: Season name
    type: string
    description: Shown all over the site, for example Winter Indoor Soccer or Spring Basketball.
    required: true
  - name: sport
    label: Sport for this season
    type: select
    description: This sport gets the big card on the home page. The other sports show as Coming later.
    required: true
    options:
      values:
      - Soccer
      - Basketball
      - Baseball
      - Flag football
  - name: session_day
    label: Day of the week
    type: select
    description: The day sessions happen. The site says "Sundays", "Saturdays" and so on from this.
    required: true
    options:
      values:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
  - name: button
    label: Big Register button words
    type: string
    description: 'For example: Register for winter soccer. All Register buttons go to the sign-up page.'
  - name: menu_button
    label: Menu Register words
    type: string
    description: 'The shorter Register words in the menu, for example: Register for soccer.'
  - name: registration_opens
    label: Registration opens
    type: date
    description: The home page countdown counts down to this day, then switches to "Registration is open now" on its own. These dates also update the scoreboard, schedule and sign-up page. Check Parent
      questions too, since those answers are written out by hand.
    required: true
    options: &id003
      format: yyyy-MM-dd
  - name: registration_closes
    label: Registration closes
    type: date
    required: true
    options: *id003
  - name: first_sunday
    label: First session day
    type: date
    required: true
    options: *id003
  - name: last_sunday
    label: Last session day
    type: date
    required: true
    options: *id003
  - name: sundays
    label: Number of sessions
    type: number
    required: true
  - name: spots
    label: Number of spots
    type: number
    required: true
  - name: fee
    label: Fee per athlete, in dollars
    type: number
    description: Numbers only, like 30.
    required: true
  - name: youngest_age
    label: Youngest age
    type: number
    required: true
  - name: oldest_age
    label: Oldest age
    type: number
    description: Leave empty if there is no top age yet.
  - name: where
    label: Where
    type: string
    description: The venue. Leave empty until it's set.
  - name: session_times
    label: Session times
    type: string
    description: 'For example: 1 to 2 PM'
  - name: how_to_pay
    label: How to pay
    type: text
    description: One or two sentences families see on the Programs page.
  - name: countdown_before
    label: Countdown words
    type: string
    description: Shown after the number of days, for example "8 days until registration opens November 20". The date fills in on its own.
  - name: countdown_open
    label: Countdown words once registration is open
    type: string
    description: The closing date fills in on its own after these words.
  - name: countdown_closed
    label: Countdown words after registration closes
    type: text
- name: aasc-sports
  label: 'All Abilities: Sports'
  type: file
  path: _data/aasc/sports.yml
  format: yaml
  fields:
  - name: soon_tag
    label: '"Coming later" tag words'
    type: string
    description: The small tag on sports that aren't open yet.
  - name: sports
    label: Sports
    type: object
    list: true
    description: Drag to reorder. The sport picked under Current season gets the big card, and the rest show as Coming later on the Home and Programs pages.
    fields:
    - name: name
      label: Sport name
      type: string
      required: true
    - name: picture
      label: Drawing
      type: select
      required: true
      description: Which drawing this card uses.
      options:
        values:
        - Soccer
        - Basketball
        - Baseball
        - Flag football
    - name: line
      label: Short line
      type: string
      description: 'One short line, for example: Dribble, pass and shoot.'
- name: aasc-events
  label: 'All Abilities: Upcoming events'
  type: file
  path: all-abilities-claude/content/events.json
  format: json
  list: true
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Date
    description: Past events hide from the site on their own the day after.
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: time
    label: Time
    description: 'For example: 5 to 7 PM'
    type: string
  - name: place
    label: Where
    type: string
  - name: details
    label: What to expect
    description: One short line each.
    type: string
    list: true
  - name: note
    label: Small print
    type: text
  - name: button
    label: Button words
    description: 'For example: Details and tickets'
    type: string
  - name: link
    label: Button link
    description: Paste the full link, starting with https://. Leave empty for no button.
    type: string
    pattern: *id002
- name: aasc-faq
  label: 'All Abilities: Parent questions'
  type: file
  path: _data/aasc/faq.yml
  format: yaml
  list: true
  fields:
  - name: question
    label: Question
    type: string
    required: true
  - name: answer
    label: Answer
    type: rich-text
    required: true
    options: &id004
      format: html
      media: false
  - name: coming_soon
    label: Show a "Coming soon" tag
    type: boolean
- name: aasc-home
  label: 'All Abilities: Home page'
  type: file
  path: _data/aasc/home.yml
  format: yaml
  fields:
  - name: hero
    label: Top of the page
    type: object
    fields:
    - name: headline_1
      label: Headline, first line
      type: string
      description: The bouncing ball sits at the end of this line.
    - name: headline_2
      label: Headline, second line
      type: string
    - name: headline_mark
      label: Underlined word
      type: string
      description: Shown at the end of the second line, with the green underline.
    - name: text
      label: Intro paragraph
      type: text
      description: The paragraph under the big headline.
    - name: story_link
      label: Small link words
      type: string
      description: The link next to the Register button. It jumps to the story below.
    - name: team_name
      label: Card title
      type: string
      description: On the drawing of the team, for example Team All Abilities.
    - name: team_tag
      label: Card tag
      type: string
    - name: ticker
      label: Scrolling words
      type: string
      description: The words that slide across the bottom of the top section. One per line.
      list: true
  - name: story
    label: Story section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: photo
      label: Photo
      type: image
      description: Only add photos of children after a parent or guardian signs the photo release.
    - name: photo_description
      label: Photo description
      type: string
      description: A few words describing the photo, for people who use screen readers.
    - name: quote
      label: Founder quote
      type: text
    - name: quote_highlight
      label: Highlighted words
      type: text
      description: Copy a part of the quote here, word for word, and it gets a soft highlight. Leave empty for none.
    - name: quote_by
      label: Quote by
      type: string
    - name: button
      label: Second button words
      type: string
      description: The button next to Register. It opens the Our story page.
  - name: glance
    label: Season scoreboard
    type: object
    description: The numbers and dates here come from Current season.
    fields:
    - name: faq_button
      label: Parent questions button words
      type: string
  - name: lineup
    label: Sports section
    type: object
    description: The sport cards come from Sports and Current season.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: open_tag
      label: Tag words on the open sport
      type: string
      description: The opening date fills in after these words.
    - name: season_link
      label: Link words on the big card
      type: string
    - name: note
      label: Note under the cards
      type: text
  - name: gameday
    label: Game day section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: programs_title
      label: First card title
      type: string
    - name: programs_text
      label: First card text
      type: text
    - name: programs_link
      label: First card link words
      type: string
    - name: donate_title
      label: Second card title
      type: string
    - name: donate_text
      label: Second card text
      type: text
    - name: donate_link
      label: Second card link words
      type: string
  - name: events
    label: Events section
    type: object
    description: The events themselves are under Upcoming events.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: note
      label: Note under the events
      type: text
      description: Put words in [square brackets] to turn them into a link to the club's Facebook page.
    - name: empty
      label: Words when no events are coming up
      type: text
  - name: faq
    label: Parent questions section
    type: object
    description: The questions themselves are under Parent questions.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: button
      label: Button words
      type: string
  - name: join
    label: Join the team section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: play_title
      label: First box title
      type: string
    - name: play_text
      label: First box text
      type: string
    - name: volunteer_title
      label: Second box title
      type: string
    - name: volunteer_text
      label: Second box text
      type: string
    - name: give_title
      label: Third box title
      type: string
    - name: give_text
      label: Third box text
      type: string
