- name: aasc-gallery
  label: Gallery
  type: file
  path: _data/aasc/gallery.yml
  format: yaml
  fields:
  - name: kicker
    label: Small label above the headline
    type: string
    description: The small capital-letter words just above the heading.
  - name: headline
    label: Headline
    type: string
    description: The big title at the top of this page.
  - name: intro
    label: Intro line
    type: text
    description: The sentence under the heading.
  - name: pick_heading
    label: Heading above the photo groups
    type: string
    description: The heading above the photo group cards.
  - name: has_photos_line
    label: Line when there are photos
    type: string
    description: Shown under the headline once photos are added.
  - name: no_photos_line
    label: Line when there are no photos yet
    type: string
    description: Shown under the headline before any photos are added.
  - name: coming_soon
    label: Words on a group with no photos
    type: string
    description: Shown on a photo group card that has no photos yet.
  - name: season_tag
    label: Tag on the big card
    type: string
    description: Shows on the big card when that photo group has the same name as the sport that is Open now or Opening soon.
  - name: photo_word
    label: Word after the count for 1 photo
    type: string
    hidden: true
  - name: photos_word
    label: Word after the count for more photos
    type: string
    description: 'Photo groups (just below): Each group is one card on the Gallery page, like a sport, Buddies or Game Day. Add, remove or drag to reorder. The first group that has photos gets the big card on top. Only add photos of children after a parent or guardian signs the photo release.'
    hidden: true
  - name: groups
    label: Photo groups
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Group name
      type: string
      required: true
      description: 'For example: Soccer, Buddies or Game Day.'
    - name: picture
      label: Drawing
      type: select
      required: true
