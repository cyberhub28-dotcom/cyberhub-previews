  - name: kicker
    label: Small label above the headline
    type: string
  - name: headline
    label: Headline
    type: string
  - name: intro
    label: Intro line
    type: text
  - name: gift_heading
    label: Gift heading
    type: string
  - name: gift_text
    label: Make a gift text
    type: text
  - name: donate_button
    label: Donate button words
    type: string
    description: The link is Donate button link, under Club details and links.
  - name: donate_button_note
    label: Line under the Donate button
    type: string
  - name: tax_note
    label: Tax line
    type: text
    description: Keep this line unless the club gets its IRS 501(c)(3) letter. Ask before changing it.
  - name: sponsor_heading
    label: Sponsor heading
    type: string
  - name: sponsor_text
    label: Partner with us text
    type: text
  - name: sponsor_button
    label: Sponsor button words
    type: string
  - name: levels_kicker
    label: 'Levels: small label'
    type: string
  - name: levels_heading
    label: 'Levels: heading'
    type: string
    description: 'Sponsorship levels (just below): Drag to reorder.'
  - name: levels
    label: Sponsorship levels
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name} ({amount})'
    fields:
