  - name: pay_button
    label: Pay button words
    type: string
    description: Only shows when Payment link is filled in, under Club details and links.
  - name: volunteer_heading
    label: Volunteer heading
    type: string
  - name: volunteer_text
    label: Volunteer text
    type: text
  - name: volunteer_card
    label: Volunteer box line
    type: string
  - name: volunteer_button
    label: Volunteer button words
    type: string
    description: The link is Volunteer form link, under Club details and links.
- name: aasc-gallery
  label: 'All Abilities: Gallery page'
  type: file
  path: _data/aasc/gallery.yml
  format: yaml
  fields:
  - name: kicker
    label: Small label above the headline
    type: string
  - name: headline
    label: Headline
    type: string
  - name: intro
    label: Intro line
    type: text
  - name: pick_heading
    label: Heading above the sports
    type: string
  - name: has_photos_line
    label: Line when there are photos
    type: string
  - name: no_photos_line
    label: Line when there are no photos yet
    type: string
  - name: coming_soon
    label: Words on a sport with no photos
    type: string
  - name: season_tag
    label: Tag on the big card
    type: string
    description: Shows when the big card is the current season's sport.
  - name: photos
    label: Photos
    type: object
    description: Add as many photos as you like. Pick a sport for each one, and it joins that sport's set. Each sport always has one card on the page, and the sport of the newest photo (the last one in
      this list) gets the big card on top. Only add photos of children after a parent or guardian signs the photo release.
    list: true
    fields:
    - name: photo
      label: Photo
      type: image
      required: true
    - name: category
      label: Sport
      type: select
      required: true
      description: Which sport this photo belongs to.
      options:
        values:
        - Soccer
        - Buddies
        - Basketball
        - Baseball
        - Flag Football
        - Game Day
    - name: description
      label: Photo description
      type: string
      required: true
      description: A short description of what's in the photo, read out by screen readers. For example "Two players high-five after a goal." First names only.
    - name: caption
      label: Caption
      type: string
      description: Optional. A few words shown under the photo when it's open.
