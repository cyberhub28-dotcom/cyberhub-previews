# Pages CMS setup (https://pagescms.org). Lets you edit site content with simple forms.
# The sidebar follows the site's menu. Each page's form runs top to bottom in the same
# order as the page, and each numbered box matches a section you can see on the site.
# Sports are one file each in _aasc_sports; everything else is in _data/aasc.
media:
- name: images
  label: Photos
  input: all-abilities-claude/images
  output: /all-abilities-claude/images
  categories:
  - image
content:
- name: aasc-home
  label: Home
  type: file
  path: _data/aasc/home.yml
  format: yaml
  fields:
  - name: hero
    label: 1. Top of the page
    type: object
    description: The navy band at the very top. The small words above the headline, the green button and the countdown come from Sports, from the first sport that is Open now or Opening soon.
    fields:
    - name: headline_1
      label: Big headline, first line
      type: string
      description: The bouncing ball sits at the end of this line.
    - name: headline_2
      label: Big headline, second line
      type: string
      description: The words before the underlined word.
    - name: headline_mark
      label: Underlined word
      type: string
      description: The last word, with the green underline.
    - name: text
      label: Paragraph under the headline
      type: text
    - name: story_link
      label: Link next to the green button
      type: string
      description: It jumps down to the story.
    - name: countdown
      label: Countdown line under the buttons
      type: object
      description: Its dates and spots come from Sports.
      fields:
      - name: before
        label: Before sign-ups open
        type: string
        description: 'Shown after the number of days, for example: until registration opens.'
      - name: open
        label: While sign-ups are open
        type: string
        description: The closing date and spots are added on their own.
      - name: closed
        label: After sign-ups close
        type: text
    - name: team_name
      label: 'Team drawing: name'
      type: string
      description: On the drawing of the team, on the right.
    - name: team_tag
      label: 'Team drawing: tag'
      type: string
      description: 'The small tag on the drawing of the team. Under this, Scrolling words along the bottom: The sport names scroll first on their own. Add more words here, one per line.'
    - name: ticker
      label: Scrolling words along the bottom
      type: string
      list: true
  - name: story
    label: 2. Why we started (Amber's quote)
    type: object
    description: The section with Amber's quote. The four values under it are in Whole site.
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: photo
      label: Photo
      type: image
      description: Only add photos of children after a parent or guardian signs the photo release.
    - name: photo_description
      label: Photo description
      type: string
      description: A few words about the photo, for people who use screen readers.
    - name: quote
      label: Quote
      type: text
      description: Amber's words, shown in quotation marks.
    - name: quote_highlight
      label: Highlighted words
      type: text
      description: Copy part of the quote here, word for word, and it gets a soft highlight. Leave empty for none.
    - name: quote_by
      label: Name under the quote
      type: string
    - name: button
      label: Second button
      type: string
      description: The button next to Register. It opens Our Story.
  - name: glance
    label: 3. Navy numbers band
    type: object
    description: The dates, spots, fee and sessions come from Sports. Only the small labels change here. This band only shows when a sport is Open now or Opening soon.
    fields:
    - name: opens_label
      label: Label before sign-ups open
      type: string
      description: 'For example: Opens'
    - name: closes_label
      label: Label while sign-ups are open
      type: string
      description: 'For example: Closes'
    - name: spots_label
      label: Spots label
      type: string
    - name: fee_label
      label: Fee label
      type: string
    - name: fee_each
      label: Small word after the fee
      type: string
      description: 'For example: EACH'
    - name: sessions_label
      label: Sessions label
      type: string
      description: 'The day is added in front, for example: Sunday sessions.'
    - name: faq_button
      label: Second button
      type: string
      description: It jumps to Parent questions.
  - name: lineup
    label: 4. Sports cards
    type: object
    description: The cards come from Sports. Open and Opening soon sports show first.
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Line under the heading
      type: text
    - name: season_link
      label: Link words on open sport cards
      type: string
      description: 'For example: See the season.'
    - name: note
      label: Line under the cards
      type: text
      description: Only shows when a sport is Coming later.
  - name: gameday
    label: 5. Game day (navy band with two cards)
    type: object
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: programs_title
      label: 'Left card: title'
      type: string
    - name: programs_text
      label: 'Left card: text'
      type: text
    - name: programs_link
      label: 'Left card: link words'
      type: string
      description: It opens Programs.
    - name: donate_title
      label: 'Right card: title'
      type: string
    - name: donate_text
      label: 'Right card: text'
      type: text
    - name: donate_link
      label: 'Right card: link words'
      type: string
      description: It opens Donate.
  - name: events
    label: 6. Upcoming events
    type: object
    description: Past events drop off the page on their own the day after.
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Line under the heading
      type: text
      description: 'Under this, Events: Tap Add an item for a new event. Drag to change the order.'
    - name: list
      label: Events
      type: object
      fields:
      - name: title
        label: Event name
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        default: ''
      - name: time
        label: Time
        type: string
        description: 'For example: 5 to 7 PM.'
      - name: place
        label: Where
        type: string
        description: 'Under this, What to expect: One line each.'
      - name: details
        label: What to expect
        type: string
        list: true
      - name: note
        label: Small print
        type: text
        description: Shown under the details.
      - name: button
        label: Button words
        type: string
        description: 'For example: Details and tickets.'
      - name: link
        label: Button link
        type: string
        description: Paste the full link, starting with https://.
        pattern:
          regex: ^(https://\S+)?$
          message: Paste the full link, starting with https://, or leave it empty
      list:
        collapsible:
          collapsed: true
          summary: '{title} ({date})'
    - name: note
      label: Line under the events
      type: text
      description: Put square brackets around the words that should link to Facebook, like [Facebook page].
    - name: empty
      label: Words when no events are coming up
      type: text
      description: Only shows when the list is empty.
    - name: details_button
      label: Button words for an event without its own
      type: string
      description: Only used when an event's Button words is empty.
  - name: faq
    label: 7. Parent questions
    type: object
    description: The first six questions (what the season is, sign-up dates, cost, how to pay, where, times) are filled in from Sports. Add any other questions below.
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Line under the heading
      type: text
    - name: button
      label: Button under the heading
      type: string
      description: 'It opens Contact. Under this, More questions: Tap Add an item for a new question. Drag to change the order.'
    - name: questions
      label: More questions
      type: object
      fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: rich-text
        options:
          format: html
          switcher: false
      - name: coming_soon
        label: Show a "Coming soon" tag
        type: boolean
        description: Turn on when the answer is not ready yet.
      list:
        collapsible:
          collapsed: true
          summary: '{question}'
    - name: soon_tag
      label: '"Coming soon" tag words'
      type: string
      description: The tag on a question whose answer is not ready yet.
  - name: join
    label: 8. Join the team (three boxes)
    type: object
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Line under the heading
      type: text
    - name: play_title
      label: 'First box: title'
      type: string
    - name: play_text
      label: 'First box: text'
      type: string
    - name: volunteer_title
      label: 'Second box: title'
      type: string
    - name: volunteer_text
      label: 'Second box: text'
      type: string
    - name: give_title
      label: 'Third box: title'
      type: string
    - name: give_text
      label: 'Third box: text'
      type: string
  - name: page
    label: Browser tab and Google (rarely needed)
    type: object
    description: Not shown on the page. This is the name on the browser tab and the short summary Google and Facebook show.
    fields:
    - name: tab_title
      label: Browser tab name
      type: string
    - name: description
      label: Google and sharing summary
      type: text
      description: One or two sentences.
- name: aasc-programs
