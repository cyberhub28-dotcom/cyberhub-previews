- name: aasc-site
  label: Whole site
  type: file
  path: _data/aasc/site.yml
  format: yaml
  fields:
  - name: menu
    label: 1. Menu at the top
    type: object
    description: On every page.
    fields:
    - name: programs
      label: Programs link
      type: string
    - name: story
      label: Our Story link
      type: string
    - name: involved
      label: Get Involved link
      type: string
    - name: gallery
      label: Gallery link
      type: string
    - name: donate
      label: Donate link
      type: string
    - name: contact
      label: Contact link
      type: string
    - name: register
      label: Register button
      type: string
      description: 'The green button. In the phone menu the open sport is added, for example: Register for soccer.'
    - name: menu_button
      label: menu_button
      type: string
      hidden: true
    - name: skip_link
      label: skip_link
      type: string
      hidden: true
  - name: footer
    label: 2. Footer at the bottom
    type: object
    description: On every page.
    fields:
    - name: about
      label: Sentence under the logo
      type: text
    - name: explore_heading
      label: First column heading
      type: string
    - name: programs
      label: Programs link
      type: string
    - name: story
      label: Our Story link
      type: string
    - name: sign_up
      label: Sign up link
      type: string
    - name: volunteer
      label: Volunteer link
      type: string
    - name: faq
      label: Parent questions link
      type: string
    - name: gallery
      label: Gallery link
      type: string
    - name: connect_heading
      label: Second column heading
      type: string
    - name: donate
      label: Donate link
      type: string
    - name: contact
      label: Contact link
      type: string
    - name: facebook
      label: Facebook link
      type: string
    - name: privacy
      label: Privacy link
      type: string
    - name: copyright_name
      label: Name after the © sign
      type: string
  - name: club
    label: 3. Club details
    type: object
    description: 'Used across the site: Contact page, footer, buttons. Under this, 4. Club values: The four words in a strip on Home and Our Story. One per line.'
    fields:
    - name: email
      label: Club email
      type: string
      description: Where the contact form and Email the club box send to.
    - name: contact_person
      label: Contact name
      type: string
      description: Shown on the Contact page.
    - name: area_line
      label: Area line
      type: string
      description: Shown on the Contact page.
    - name: facebook
      label: Facebook page link
      type: string
      pattern:
        regex: ^(https://\S+)?$
        message: Paste the full link, starting with https://, or leave it empty
    - name: donate_link
      label: Donate button link
      type: string
      description: The page the Donate button opens.
      pattern:
        regex: ^(https://\S+)?$
        message: Paste the full link, starting with https://, or leave it empty
    - name: volunteer_form
      label: Volunteer form link
      type: string
      description: The form the Volunteer button opens.
      pattern:
        regex: ^(https://\S+)?$
        message: Paste the full link, starting with https://, or leave it empty
  - name: values
    label: 4. Club values
    type: string
    list: true
  - name: not_found
    label: 5. Page not found (rarely needed)
    type: object
    description: Only shows when someone opens a link that does not exist.
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: text
      label: Text
      type: text
    - name: home_button
      label: Home button words
      type: string
    - name: tab_title
      label: Browser tab name
      type: string
    - name: description
      label: Google and sharing summary
      type: text
