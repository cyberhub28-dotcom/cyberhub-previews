  format: yaml
  fields:
  - name: top
    label: 1. Top of the page
    type: object
    description: The navy band at the top. Each sport's box (title, dates, fee, Register button) is edited in Sports, in the menu on the left.
    fields:
    - name: kicker
      label: Small words above the headline
      type: string
      description: The small capital letters just above the big headline.
    - name: headline
      label: Big headline
      type: string
      description: The large white title.
    - name: intro
      label: Line under the headline
      type: text
      description: The sentence under the big headline.
  - name: steps
    label: 2. How to join (box on the right)
    type: object
    fields:
    - name: heading
      label: Heading
      type: string
      description: 'Under this, Steps: Drag to change the order.'
    - name: list
      label: Steps
      type: object
      fields:
      - name: title
        label: Step title
        type: string
        required: true
      - name: text
        label: Step text
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    - name: button
      label: Button under the steps
      type: string
      description: It opens Get Involved.
  - name: later
    label: 3. Coming later sports
    type: object
    description: The cards come from Sports. This part only shows when a sport is Coming later.
    fields:
    - name: kicker
      label: Small words above the heading
      type: string
      description: The small capital letters just above the heading.
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Line under the heading
      type: text
  - name: over
    label: 4. Past seasons
    type: object
    description: Only shows when a sport is Season over.
    fields:
    - name: heading
      label: Heading
      type: string
  - name: words
    label: 5. Labels inside every sport box (rarely needed)
    type: object
    description: The small words next to each fact. Also used on the Home and Get Involved pages.
    fields:
    - name: open
      label: Tag when sign-ups are open
      type: string
    - name: soon
      label: Tag before sign-ups open
      type: string
      description: The date is added after it.
    - name: later
      label: Tag on Coming later cards
      type: string
    - name: over
      label: Tag on past seasons
      type: string
    - name: signups
      label: Sign-ups label
      type: string
    - name: season
      label: Season label
      type: string
    - name: sessions
      label: Sessions label
      type: string
    - name: times
      label: Session times label
      type: string
    - name: where
      label: Where label
      type: string
    - name: ages
      label: Ages label
      type: string
    - name: fee
      label: Fee label
      type: string
    - name: per_athlete
      label: Words after the fee
      type: string
    - name: spots
      label: Spots label
      type: string
    - name: pay
      label: How to pay label
      type: string
    - name: register
      label: Register button start
      type: string
      description: 'Used when a sport has no Register button words, for example: Register for Winter Indoor Soccer.'
  - name: page
    label: Browser tab and Google (rarely needed)
    type: object
    description: Not shown on the page. This is the name on the browser tab and the short summary Google and Facebook show.
    fields:
    - name: tab_title
      label: Browser tab name
      type: string
    - name: description
      label: Google and sharing summary
      type: text
      description: One or two sentences.
- name: aasc-sports
  label: Sports
  type: collection
  path: _aasc_sports
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - name
    - status
    - signups_open
    primary: name
    sort:
    - name
    default:
      sort: name
      order: asc
  fields:
  - name: name
    label: Sport name
    type: string
    description: The sport, for example Basketball. Shown on the sport cards.
    required: true
  - name: status
    label: Status
    type: select
    description: 'Open now: families can sign up now. Opening soon: dates are set, sign-ups not open yet. Both get a full box on Programs and Get Involved, and the first one also fills the Home page countdown, numbers band and season questions. Coming later: a small card with no dates. Season over: moves to Past seasons. Hidden: not on the site.'
    required: true
    default: Coming later
    options:
      values:
      - Open now
      - Opening soon
      - Coming later
      - Season over
      - Hidden
  - name: season_name
    label: Season name (the big title of its box)
    type: string
    description: 'For example: Spring Basketball. Leave empty to use the sport name.'
  - name: description
    label: Description
    type: text
    description: The few sentences under the title on Programs. Also answers "What is ...?" in the Home page questions.
  - name: photo
    label: Photo at the top of its box (optional)
    type: image
    description: Only add photos of children after a parent or guardian signs the photo release.
  - name: signups_open
    label: Sign-ups open
    type: date
    description: First day families can sign up. The Home page counts down to it.
    options:
      format: yyyy-MM-dd
    default: ''
  - name: signups_close
    label: Sign-ups close
    type: date
    description: Last day families can sign up.
    options:
      format: yyyy-MM-dd
    default: ''
  - name: first_day
    label: First session
    type: date
    description: First day of play.
    options:
      format: yyyy-MM-dd
    default: ''
  - name: last_day
    label: Last session
    type: date
    description: Last day of play.
    options:
      format: yyyy-MM-dd
    default: ''
  - name: day
    label: Day of the week
    type: select
    description: The day sessions happen. The site turns it into Sundays, Saturdays and so on.
    options:
      values:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
  - name: sessions
    label: Number of sessions
    type: number
    description: Numbers only, like 6.
  - name: times
    label: Session times
    type: string
    description: 'For example: 1 to 2 PM. Leave empty until it is set. The site shows "To confirm" until then.'
  - name: where
    label: Where
    type: string
    description: 'For example: Dayton Functional Fitness in Beavercreek, Ohio. Leave empty until it is set. The site shows "To confirm" until then.'
  - name: ages
    label: Ages
    type: string
    description: 'For example: Ages 3 to 12, or From age 3.'
  - name: fee
    label: Fee
    type: string
    description: 'For example: $30. The site adds "per athlete" after it.'
  - name: spots
    label: Number of spots
    type: number
    description: Numbers only, like 48. Leave empty for no limit.
  - name: how_to_pay
    label: How to pay
    type: text
    description: One or two sentences. Leave empty until it is set. The site shows "To confirm" until then.
  - name: button
    label: Register button words
    type: string
    description: 'For example: Register for spring basketball. Leave empty for "Register for" plus the season name.'
  - name: signup_link
    label: Sign-up form link
    type: string
    description: The online form families fill in, like a Google Form or Zeffy page. Until it is added, the Register button on Get Involved stays switched off.
    pattern:
      regex: ^(https://\S+)?$
      message: Paste the full link, starting with https://, or leave it empty
  - name: payment_link
    label: Payment link (optional)
    type: string
    description: Only if families pay on a separate page. A Pay the fee button then shows next to Register on Get Involved.
    pattern:
      regex: ^(https://\S+)?$
      message: Paste the full link, starting with https://, or leave it empty
  - name: line
    label: Short line on its small card
    type: string
    description: 'One short line, for example: Dribble, pass and shoot. Shown on the Home page sports cards and the Coming later cards.'
  - name: picture
    label: Drawing and colors
    type: select
    description: The drawing on its cards. For a sport with no drawing of its own, pick Cheering kids.
    required: true
    default: Cheering kids
    options:
      values:
      - Soccer
      - Basketball
      - Baseball
      - Flag football
      - Buddies
      - Cheering kids
