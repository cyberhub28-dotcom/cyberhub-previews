- name: aasc-events
  label: Upcoming events
  type: file
  path: all-abilities-claude/content/events.json
  format: json
  list:
    collapsible:
      collapsed: true
      summary: '{title} ({date})'
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Date
    description: Past events hide from the site on their own the day after.
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: time
    label: Time
    description: 'For example: 5 to 7 PM'
    type: string
  - name: place
    label: Where
    type: string
    description: 'What to expect (just below): One short line each.'
  - name: details
    label: What to expect
    type: string
    list: true
  - name: note
    label: Small print
    type: text
  - name: button
    label: Button words
    description: 'For example: Details and tickets'
    type: string
  - name: link
    label: Button link
    description: Paste the full link, starting with https://. Leave empty for no button.
    type: string
    pattern:
      regex: ^(https://\S+)?$
      message: Paste the full link, starting with https://, or leave it empty
- name: aasc-faq
  label: Parent questions
  type: file
  path: _data/aasc/faq.yml
  format: yaml
  list:
    collapsible:
      collapsed: true
