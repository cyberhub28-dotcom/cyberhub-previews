    type: string
  - name: intro
    label: Intro line
    type: text
  - name: soccer_text
    label: Season description
    type: text
    description: Under the season name. The season facts come from Current season.
  - name: open_tag
    label: Tag on the season box
    type: string
    description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
  - name: facts
    label: Season facts box
    type: object
    description: Labels and lines in the season box. Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in. The place, times and ages come from Current season.
    fields:
    - name: opens_label
      label: Opens label
      type: string
    - name: opens
      label: Opens line
      type: string
    - name: closes_label
      label: Closes label
      type: string
    - name: closes
      label: Closes line
      type: string
    - name: sessions_label
      label: Sessions label
      type: string
    - name: sessions
      label: Sessions line
      type: string
    - name: fee_label
      label: Fee label
      type: string
    - name: fee
      label: Fee line
      type: string
    - name: spots_label
      label: Spots label
      type: string
    - name: spots
      label: Spots line
      type: string
    - name: where_label
      label: Where label
      type: string
    - name: times_label
      label: Session times label
      type: string
    - name: ages_label
      label: Ages label
      type: string
    - name: ages
      label: Ages line
      type: string
    - name: ages_no_top
      label: Ages line when there is no oldest age
      type: string
  - name: steps_heading
    label: Steps heading
    type: string
  - name: step1_title
    label: Step 1 title
    type: string
    description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
  - name: step1_text
    label: Step 1 text
    type: text
    description: Step 1's title shows the opening date on its own.
  - name: step2_title
    label: Step 2 title
    type: string
  - name: step2_text
    label: Step 2 text
    type: text
  - name: step3_title
    label: Step 3 title
    type: string
    description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
  - name: step3_text
    label: Step 3 text until How to pay is filled in
    type: text
    description: Once How to pay is filled in under Current season, that shows here instead.
  - name: step4_title
    label: Step 4 title
    type: string
    description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
  - name: step4_text
    label: Step 4 text
    type: text
    description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
  - name: button
    label: Button words
    type: string
  - name: later_kicker
    label: 'Coming later: small label'
    type: string
    description: The Coming later sports themselves are under Sports.
  - name: later_heading
    label: 'Coming later: heading'
    type: string
    description: The Coming later sports themselves are under Sports.
  - name: later_intro
    label: Coming later intro
    type: text
    description: The Coming later sports themselves are under Sports.
  - name: page
    label: Browser tab and Google
    type: object
    description: The words in the browser tab, and the short summary Google and Facebook show when the page is shared.
    fields:
    - name: tab_title
      label: Browser tab title
      type: string
      description: 'For example: Programs | All Abilities Sports Club'
    - name: description
      label: Short summary for Google and sharing
      type: text
      description: One or two sentences. Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
- name: aasc-sports
  label: Sports (Programs and Home)
  type: file
  path: _data/aasc/sports.yml
  format: yaml
  fields:
  - name: soon_tag
    label: '"Coming later" tag words'
    type: string
    description: 'The small tag on sports that aren''t open yet. Sports (just below): Add, edit, remove or drag to reorder. The sport set to This season gets the big card on the Home and Programs pages. Coming later sports show as smaller cards. Hidden ones stay saved but don''t show.'
  - name: sports
    label: Sports
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name} ({status})'
    fields:
    - name: name
      label: Sport name
      type: string
      required: true
    - name: status
      label: Status
      type: select
      required: true
      default: Coming later
      description: Set only one sport to This season.
      options:
        values:
        - This season
        - Coming later
        - Hidden
    - name: picture
      label: Drawing
      type: select
      required: true
      default: Cheering kids
      description: Which drawing and colors the card uses. For a new sport with no drawing of its own, pick Cheering kids.
      options:
        values:
        - Soccer
        - Basketball
        - Baseball
        - Flag football
        - Buddies
        - Cheering kids
    - name: line
      label: Short line
      type: string
      description: 'One short line, for example: Dribble, pass and shoot.'
- name: aasc-season
  label: Current season (dates, fee, spots)
  type: file
  path: _data/aasc/season.yml
  format: yaml
  fields:
  - name: name
    label: Season name
    type: string
    description: Shown all over the site, for example Winter Indoor Soccer or Spring Basketball. Pick which sport gets the big card under Sports.
    required: true
  - name: session_day
    label: Day of the week
    type: select
    description: The day sessions happen. The site says "Sundays", "Saturdays" and so on from this.
    required: true
    options:
      values:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
  - name: button
    label: Big Register button words
    type: string
    description: 'For example: Register for winter soccer. All Register buttons go to the sign-up page.'
  - name: menu_button
    label: Menu Register words
    type: string
    description: 'The shorter Register words in the menu, for example: Register for soccer.'
  - name: registration_opens
    label: Registration opens
    type: date
    description: The home page countdown counts down to this day, then switches to "Registration is open now" on its own. These dates also update the scoreboard, schedule and sign-up page. Check Parent questions too, since those answers are written out by hand.
    required: true
    options:
      format: yyyy-MM-dd
  - name: registration_closes
    label: Registration closes
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: first_sunday
    label: First session day
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: last_sunday
    label: Last session day
    type: date
    required: true
    options:
      format: yyyy-MM-dd
  - name: sundays
    label: Number of sessions
    type: number
    required: true
  - name: spots
    label: Number of spots
    type: number
    required: true
  - name: fee
    label: Fee per athlete, in dollars
    type: number
    description: Numbers only, like 30.
    required: true
  - name: youngest_age
    label: Youngest age
    type: number
    required: true
  - name: oldest_age
    label: Oldest age
    type: number
    description: Leave empty if there is no top age yet.
  - name: where
    label: Where
    type: string
    description: The venue. Leave empty until it's set.
  - name: session_times
    label: Session times
    type: string
    description: 'For example: 1 to 2 PM'
  - name: how_to_pay
    label: How to pay
    type: text
    description: One or two sentences families see on the Programs page.
  - name: countdown_before
    label: Countdown words
    type: string
    description: Shown after the number of days, for example "8 days until registration opens November 20". The date fills in on its own.
  - name: countdown_day
    label: Countdown word for one day
    type: string
    description: 'Under the number when there is 1 day left, like: day'
  - name: countdown_days
    label: Countdown word for more days
    type: string
    description: 'Under the number, like: days'
  - name: countdown_tomorrow
    label: Countdown word for the last day
    type: string
    description: 'Shown the day before sign-ups open, like: tomorrow,'
  - name: countdown_open
    label: Countdown words once registration is open
    type: string
    description: 'Shown on the home page while sign-ups are open. Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in. Fill-ins: {closes} {spots}'
  - name: countdown_closed
    label: Countdown words after registration closes
    type: text
