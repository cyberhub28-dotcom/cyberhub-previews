# Pages CMS setup (https://pagescms.org). Lets you edit site content with simple forms.
# Each entry below shows up in the Pages CMS sidebar. The All Abilities entries edit the
# files in _data/aasc (and the events file); GitHub Pages builds the pages from them.
media:
  input: all-abilities-claude/images
  output: /all-abilities-claude/images
  categories:
  - image
content:
- name: aasc-home
  label: Home page
  type: file
  path: _data/aasc/home.yml
  format: yaml
  fields:
  - name: hero
    label: Top of the page
    type: object
    fields:
    - name: headline_1
      label: Headline, first line
      type: string
      description: The bouncing ball sits at the end of this line.
    - name: headline_2
      label: Headline, second line
      type: string
    - name: headline_mark
      label: Underlined word
      type: string
      description: Shown at the end of the second line, with the green underline.
    - name: season_dates
      label: Small line above the headline (after the season name)
      type: string
      description: 'Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in. For example: {days} from {first day short}'
    - name: text
      label: Intro paragraph
      type: text
      description: The paragraph under the big headline.
    - name: story_link
      label: Small link words
      type: string
      description: The link next to the Register button. It jumps to the story below.
    - name: countdown_start
      label: Countdown line before it loads
      type: string
      description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
    - name: team_name
      label: Card title
      type: string
      description: On the drawing of the team, for example Team All Abilities.
    - name: team_tag
      label: Card tag
      type: string
      description: 'Scrolling words (just below): The words that slide across the bottom of the top section. One per line.'
    - name: ticker
      label: Scrolling words
      type: string
      list: true
  - name: story
    label: Story section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: photo
      label: Photo
      type: image
      description: Only add photos of children after a parent or guardian signs the photo release.
    - name: photo_description
      label: Photo description
      type: string
      description: A few words describing the photo, for people who use screen readers.
    - name: quote
      label: Founder quote
      type: text
    - name: quote_highlight
      label: Highlighted words
      type: text
      description: Copy a part of the quote here, word for word, and it gets a soft highlight. Leave empty for none.
    - name: quote_by
      label: Quote by
      type: string
    - name: button
      label: Second button words
      type: string
      description: The button next to Register. It opens the Our story page.
  - name: glance
    label: Season scoreboard
    type: object
    description: The numbers and dates here come from Current season.
    fields:
    - name: opens_label
      label: Opens label
      type: string
    - name: spots_label
      label: Spots label
      type: string
    - name: fee_label
      label: Fee label
      type: string
    - name: fee_each
      label: Small word after the fee
      type: string
    - name: sessions_label
      label: Sessions label
      type: string
      description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
    - name: note
      label: Line under the scoreboard
      type: text
      description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
    - name: faq_button
      label: Parent questions button words
      type: string
  - name: lineup
    label: Sports section
    type: object
    description: The sport cards come from Sports and Current season.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: open_tag
      label: Tag words on the open sport
      type: string
      description: The opening date fills in after these words.
    - name: season_link
      label: Link words on the big card
      type: string
    - name: season_line
      label: Line on the big card
      type: text
      description: Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
    - name: note
      label: Note under the cards
      type: text
  - name: gameday
    label: Game day section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: programs_title
      label: First card title
      type: string
    - name: programs_text
      label: First card text
      type: text
    - name: programs_link
      label: First card link words
      type: string
    - name: donate_title
      label: Second card title
      type: string
    - name: donate_text
      label: Second card text
      type: text
    - name: donate_link
      label: Second card link words
      type: string
  - name: events
    label: Events section
    type: object
    description: The events themselves are under Upcoming events.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: note
      label: Note under the events
      type: text
      description: Put words in [square brackets] to turn them into a link to the club's Facebook page.
    - name: empty
      label: Words when no events are coming up
      type: text
    - name: details_button
      label: Event button words if none are set
      type: string
      description: Used when an event has a link but no button words.
  - name: faq
    label: Parent questions section
    type: object
    description: The questions themselves are under Parent questions.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: button
      label: Button words
      type: string
    - name: soon_tag
      label: '"Coming soon" tag words'
      type: string
      description: The small tag on questions marked Coming soon.
  - name: join
    label: Join the team section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
    - name: heading
      label: Heading
      type: string
    - name: intro
      label: Intro line
      type: text
    - name: play_title
      label: First box title
      type: string
    - name: play_text
      label: First box text
      type: string
    - name: volunteer_title
      label: Second box title
      type: string
    - name: volunteer_text
      label: Second box text
      type: string
    - name: give_title
      label: Third box title
      type: string
    - name: give_text
      label: Third box text
      type: string
  - name: page
    label: Browser tab and Google
    type: object
    description: The words in the browser tab, and the short summary Google and Facebook show when the page is shared.
    fields:
    - name: tab_title
      label: Browser tab title
      type: string
      description: 'For example: All Abilities Sports Club | Inclusive youth sports'
    - name: description
      label: Short summary for Google and sharing
      type: text
      description: One or two sentences. Words in {curly brackets} fill in by themselves from Current season, so leave the brackets in.
- name: aasc-programs
  label: Programs page
  type: file
  path: _data/aasc/programs.yml
  format: yaml
  fields:
  - name: kicker
    label: Small label above the headline
    type: string
  - name: headline
