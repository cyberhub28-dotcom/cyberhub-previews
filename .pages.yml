# Pages CMS setup (https://pagescms.org). Lets you edit site content with simple forms.
# Each entry below shows up in the Pages CMS sidebar. The All Abilities entries edit the
# files in _data/aasc (and the events file); GitHub Pages builds the pages from them.
media:
- name: images
  label: Photos
  input: all-abilities-claude/images
  output: /all-abilities-claude/images
  categories:
  - image
content:
- name: aasc-home
  label: Home
  type: file
  path: _data/aasc/home.yml
  format: yaml
  fields:
  - name: hero
    label: Top of the page
    type: object
    fields:
    - name: headline_1
      label: Headline, first line
      type: string
      description: The bouncing ball sits at the end of this line.
    - name: headline_2
      label: Headline, second line
      type: string
      description: The second line of the big headline, before the underlined word.
    - name: headline_mark
      label: Underlined word
      type: string
      description: Shown at the end of the second line, with the green underline.
    - name: text
      label: Intro paragraph
      type: text
      description: The paragraph under the big headline.
    - name: story_link
      label: Small link words
      type: string
      description: The link next to the Register button. It jumps to the story below.
    - name: countdown
      label: Countdown words
      type: object
      description: The countdown under the Register button. Its dates come from the first sport that is Open now or Opening soon on the Programs page.
      fields:
      - name: before
        label: Before sign-ups open
        type: string
        description: 'Shown after the number of days, for example: until registration opens'
      - name: open
        label: While sign-ups are open
        type: string
        description: The closing date and number of spots are added on their own.
      - name: closed
        label: After sign-ups close
        type: text
        description: Shown once the sign-up close date has passed.
    - name: team_name
      label: Card title
      type: string
      description: On the drawing of the team, for example Team All Abilities.
    - name: team_tag
      label: Card tag
      type: string
      description: 'The small tag on the drawing of the team. Scrolling words (just below): the words that slide across the bottom of the top section, one per line.'
    - name: ticker
      label: Scrolling words
      type: string
      list: true
    description: The big navy section at the top of the Home page.
  - name: story
    label: Story section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
      description: The small capital-letter words just above the heading.
    - name: heading
      label: Heading
      type: string
      description: The big title of this section.
    - name: photo
      label: Photo
      type: image
      description: Only add photos of children after a parent or guardian signs the photo release.
    - name: photo_description
      label: Photo description
      type: string
      description: A few words describing the photo, for people who use screen readers.
    - name: quote
      label: Founder quote
      type: text
      description: Amber's words, shown in quotation marks.
    - name: quote_highlight
      label: Highlighted words
      type: text
      description: Copy a part of the quote here, word for word, and it gets a soft highlight. Leave empty for none.
    - name: quote_by
      label: Quote by
      type: string
      description: The name under the quote.
    - name: button
      label: Second button words
      type: string
      description: The button next to Register. It opens the Our story page.
    description: The founder story on the Home page.
  - name: glance
    label: Scoreboard (the navy numbers band)
    type: object
    description: The dates, spots, fee and sessions come from the first sport that is Open now or Opening soon on the Programs page. Only the small labels change here.
    fields:
    - name: opens_label
      label: Label before sign-ups open
      type: string
      description: 'For example: Opens'
    - name: closes_label
      label: Label while sign-ups are open
      type: string
      description: 'For example: Closes'
    - name: spots_label
      label: Spots label
      type: string
      description: 'For example: Spots'
    - name: fee_label
      label: Fee label
      type: string
      description: 'For example: Fee'
    - name: fee_each
      label: Small word after the fee
      type: string
      description: 'For example: EACH'
    - name: sessions_label
      label: Sessions label
      type: string
      description: The day of the week is added in front, like Sunday sessions.
    - name: faq_button
      label: Parent questions button words
      type: string
      description: The second button in the scoreboard.
  - name: lineup
    label: Sports section
    type: object
    description: The sport cards come from the Sports list on the Programs page, so add or change sports there.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
      description: The small capital-letter words just above the heading.
    - name: heading
      label: Heading
      type: string
      description: The big title of this section.
    - name: intro
      label: Intro line
      type: text
      description: The sentence under the heading.
    - name: season_link
      label: Link words on open sports
      type: string
      description: 'For example: See the season. Shown on the big cards for sports that are Open now or Opening soon.'
    - name: note
      label: Line under the sport cards
      type: text
      description: A short note under the sport cards.
  - name: gameday
    label: Game day section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
      description: The small capital-letter words just above the heading.
    - name: heading
      label: Heading
      type: string
      description: The big title of this section.
    - name: programs_title
      label: First card title
      type: string
      description: The bold title of this box.
    - name: programs_text
      label: First card text
      type: text
      description: The sentence under that title.
    - name: programs_link
      label: First card link words
      type: string
      description: The words on this button or link.
    - name: donate_title
      label: Second card title
      type: string
      description: The bold title of this box.
    - name: donate_text
      label: Second card text
      type: text
      description: The sentence under that title.
    - name: donate_link
      label: Second card link words
      type: string
      description: The words on this button or link.
    description: The two cards about game day on the Home page.
  - name: events
    label: Events section
    type: object
    description: Add, edit or remove events in the Events list at the bottom of this section. Past events hide on their own the day after.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
      description: The small capital-letter words just above the heading.
    - name: heading
      label: Heading
      type: string
      description: The big title of this section.
    - name: intro
      label: Intro line
      type: text
      description: The sentence under the heading.
    - name: note
      label: Note under the events
      type: text
      description: Put words in [square brackets] to turn them into a link to the club's Facebook page.
    - name: empty
      label: Words when no events are coming up
      type: text
      description: Shown when there are no events in the list below.
    - name: details_button
      label: Event button words if none are set
      type: string
      description: Used when an event has a link but no button words.
    - name: list
      label: Events
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title} ({date})'
      fields:
      - name: title
        label: Event name
        type: string
        required: true
        description: 'For example: Launch Party.'
      - name: date
        label: Date
        description: Past events hide from the site on their own the day after.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: time
        label: Time
        description: 'For example: 5 to 7 PM'
        type: string
      - name: place
        label: Where
        type: string
        description: 'What to expect (just below): One short line each.'
      - name: details
        label: What to expect
        type: string
        list: true
      - name: note
        label: Small print
        type: text
        description: Optional. A small line at the bottom of the event card.
      - name: button
        label: Button words
        description: 'For example: Details and tickets'
        type: string
      - name: link
        label: Button link
        description: Paste the full link, starting with https://. Leave empty for no button.
        type: string
        pattern:
          regex: ^(https://\S+)?$
          message: Paste the full link, starting with https://, or leave it empty
  - name: faq
    label: Parent questions section
    type: object
    description: Add, edit, remove or drag questions in the Questions list at the bottom of this section.
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
      description: The small capital-letter words just above the heading.
    - name: heading
      label: Heading
      type: string
      description: The big title of this section.
    - name: intro
      label: Intro line
      type: text
      description: The sentence under the heading.
    - name: button
      label: Button words
      type: string
      description: The words on this button or link.
    - name: soon_tag
      label: '"Coming soon" tag words'
      type: string
      description: The small tag on questions marked Coming soon.
    - name: questions
      label: Questions
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{question}'
      fields:
      - name: question
        label: Question
        type: string
        required: true
        description: The question parents ask.
      - name: answer
        label: Answer
        type: rich-text
        required: true
        options:
          format: html
          media: false
        description: The answer. You can use bold, lists and links.
      - name: coming_soon
        label: Show a "Coming soon" tag
        type: boolean
        description: Turn on to add a small Coming soon tag to this question.
  - name: join
    label: Join the team section
    type: object
    fields:
    - name: kicker
      label: Small label above the heading
      type: string
      description: The small capital-letter words just above the heading.
    - name: heading
      label: Heading
      type: string
      description: The big title of this section.
    - name: intro
      label: Intro line
      type: text
      description: The sentence under the heading.
    - name: play_title
      label: First box title
      type: string
      description: The bold title of this box.
    - name: play_text
      label: First box text
      type: string
      description: The sentence under that title.
    - name: volunteer_title
      label: Second box title
      type: string
      description: The bold title of this box.
    - name: volunteer_text
      label: Second box text
      type: string
      description: The sentence under that title.
    - name: give_title
      label: Third box title
      type: string
      description: The bold title of this box.
    - name: give_text
      label: Third box text
      type: string
      description: The sentence under that title.
    description: The three boxes near the bottom of the Home page.
  - name: page
    label: Browser tab and Google (rarely needed)
    type: object
    description: Rarely needed. The words in the browser tab, and the short summary Google and Facebook show when this page is shared.
    fields:
    - name: tab_title
      label: Browser tab title
      type: string
      description: 'For example: All Abilities Sports Club | Inclusive youth sports'
    - name: description
      label: Short summary for Google and sharing
      type: text
      description: One or two sentences about this page.
- name: aasc-programs
  label: Programs
  type: file
  path: _data/aasc/programs.yml
  format: yaml
  fields:
  - name: kicker
    label: Small label above the headline
    type: string
    description: The small capital-letter words at the top of the page.
  - name: headline
    label: Headline
    type: string
    description: The big title at the top of the Programs page.
  - name: intro
    label: Intro line
    type: text
    description: 'The sentence under the headline. Sports (just below): one box per sport. Tap Add an item for a new sport, drag to change the order, and set each one''s Status. Open now sports show first, then Opening soon, then Coming later.'
  - name: sports
    label: Sports
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name} ({status})'
    fields:
    - name: name
      label: Sport name
      type: string
      description: 'For example: Basketball.'
      required: true
    - name: status
      label: Status
      type: select
      required: true
      default: Coming later
      description: 'Open now: families can sign up. Opening soon: dates are set but sign-ups are not open yet. Coming later: a small card, no dates yet. Season over: moves to Past seasons. Hidden: kept here but not on the site.'
      options:
        values:
        - Open now
        - Opening soon
        - Coming later
        - Season over
        - Hidden
    - name: season_name
      label: Season name
      type: string
      description: 'For example: Spring Basketball. Leave empty to use the sport name.'
    - name: line
      label: Short line for the small card
      type: string
      description: 'One short line, for example: Dribble, pass and shoot.'
    - name: description
      label: Description
      type: text
      description: A few sentences families read on the Programs page.
    - name: picture
      label: Drawing
      type: select
      required: true
      default: Cheering kids
      description: Which drawing and colors the cards use. For a sport with no drawing of its own, pick Cheering kids.
      options:
        values:
        - Soccer
        - Basketball
        - Baseball
        - Flag football
        - Buddies
        - Cheering kids
    - name: photo
      label: Photo (optional)
      type: image
      description: Shows at the top of this sport on the Programs page. Only add photos of children after a parent or guardian signs the photo release.
    - name: day
      label: Day of the week
      type: select
      description: The day sessions happen. The site says Sundays, Saturdays and so on from this.
      options:
        values:
        - Sunday
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
    - name: times
      label: Session times
      type: string
      description: 'For example: 1 to 2 PM. Leave empty until it is set.'
    - name: signups_open
      label: Sign-ups open
      type: date
      description: The Home page counts down to this day.
      options:
        format: yyyy-MM-dd
    - name: signups_close
      label: Sign-ups close
      type: date
      description: The last day families can sign up.
      options:
        format: yyyy-MM-dd
    - name: first_day
      label: First session
      type: date
      description: The first day of play.
      options:
        format: yyyy-MM-dd
    - name: last_day
      label: Last session
      type: date
      description: The last day of play.
      options:
        format: yyyy-MM-dd
    - name: sessions
      label: Number of sessions
      type: number
      description: Numbers only, like 6.
    - name: ages
      label: Ages
      type: string
      description: 'For example: Ages 3 to 12, or From age 3.'
    - name: where
      label: Where
      type: string
      description: 'The place, for example: Dayton Functional Fitness in Beavercreek, Ohio.'
    - name: fee
      label: Fee
      type: string
      description: 'For example: $30. The site adds "per athlete" after it.'
    - name: spots
      label: Number of spots
      type: number
      description: Numbers only, like 48. Leave empty for no limit.
    - name: how_to_pay
      label: How to pay
      type: text
      description: One or two sentences families see under this sport.
    - name: button
      label: Register button words
      type: string
      description: 'For example: Register for spring basketball.'
    - name: signup_link
      label: Sign-up form link
      type: string
      description: The online form families fill in, like a Google Form or Zeffy page. Leave empty until it is ready, and the Register button stays switched off on Get Involved.
      pattern: &id001
        regex: ^(https://\S+)?$
        message: Paste the full link, starting with https://, or leave it empty
    - name: payment_link
      label: Payment link (optional)
      type: string
      description: Only if families pay on a separate page. A Pay the fee button then shows next to Register.
      pattern: *id001
  - name: steps_heading
    label: Steps heading
    type: string
    description: 'The heading of the How to join box. How to join steps (just below): add, remove or drag to reorder.'
  - name: steps
    label: How to join steps
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Step title
      type: string
      description: 'A few words, for example: Fill in the form.'
      required: true
    - name: text
      label: Step text
      type: text
      description: One short sentence.
  - name: button
    label: Button under the steps
    type: string
    description: The button at the bottom of the How to join box. It opens Get Involved.
  - name: later_kicker
    label: 'Coming later: small label'
    type: string
    description: Above the Coming later sports. It only shows if a sport is set to Coming later.
  - name: later_heading
    label: 'Coming later: heading'
    type: string
    description: The heading above the Coming later sports.
  - name: later_intro
    label: 'Coming later: intro'
    type: text
    description: The sentence under that heading.
  - name: over_heading
    label: Past seasons heading
    type: string
    description: Only shows if a sport is set to Season over.
  - name: words
    label: Small words on the sport boxes
    type: object
    hidden: true
    fields:
    - name: open
      label: open
      type: string
    - name: soon
      label: soon
      type: string
    - name: later
      label: later
      type: string
    - name: over
      label: over
      type: string
    - name: signups
      label: signups
      type: string
    - name: season
      label: season
      type: string
    - name: times
      label: times
      type: string
    - name: where
      label: where
      type: string
    - name: ages
      label: ages
      type: string
    - name: fee
      label: fee
      type: string
    - name: per_athlete
      label: per_athlete
      type: string
    - name: spots
      label: spots
      type: string
    - name: pay
      label: pay
      type: string
    - name: register
      label: register
      type: string
  - name: page
    label: Browser tab and Google (rarely needed)
    type: object
    description: Rarely needed. The words in the browser tab, and the short summary Google and Facebook show when this page is shared.
    fields:
    - name: tab_title
      label: Browser tab title
      type: string
      description: 'For example: Programs | All Abilities Sports Club'
    - name: description
      label: Short summary for Google and sharing
      type: text
      description: One or two sentences about this page.
