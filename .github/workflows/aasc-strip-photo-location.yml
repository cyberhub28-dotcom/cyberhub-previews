# All Abilities Sports Club preview: remove location and camera data from photos.
# Runs after any photo lands in all-abilities-claude/images (Pages CMS uploads included),
# strips GPS and other hidden photo data, then commits the clean copies back to main.
# Only touches all-abilities-claude/images. Keeps rotation and color so photos look the same.
name: AASC photos - remove location data

on:
  push:
    branches: [main]
    paths:
      - 'all-abilities-claude/images/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: aasc-strip-photo-location
  cancel-in-progress: false

jobs:
  strip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install exiftool
        run: sudo apt-get update -q && sudo apt-get install -y -q libimage-exiftool-perl

      - name: Remove location and camera data
        run: |
          shopt -s nullglob nocaseglob
          cd all-abilities-claude/images
          files=( *.jpg *.jpeg *.png *.webp *.heic *.heif *.tif *.tiff *.gif )
          if [ ${#files[@]} -eq 0 ]; then echo "No photos."; exit 0; fi
          # Wipe all hidden photo data, then put back only rotation and color profile.
          exiftool -m -q -overwrite_original -all= -tagsFromFile @ -Orientation -ICC_Profile "${files[@]}" || true
          # Belt and braces: any GPS left over (for example in HEIC) gets removed on its own.
          exiftool -m -q -overwrite_original -gps:all= -xmp:geotag= "${files[@]}" || true
          left=$(exiftool -q -q -if '$GPSLatitude or $GPSLongitude or $GPSPosition or $GPSCoordinates' -p '$FileName' "${files[@]}" || true)
          if [ -n "$left" ]; then echo "Location data still found in: $left"; exit 1; fi
          echo "Checked ${#files[@]} photos: no location data."

      - name: Commit clean photos
        run: |
          if [ -z "$(git status --porcelain all-abilities-claude/images)" ]; then echo "Nothing to change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all-abilities-claude/images
          git commit -m "Remove location data from All Abilities photos"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; done
          echo "CHANGED=1" >> "$GITHUB_ENV"

      - name: Rebuild the site with the clean photos
        if: env.CHANGED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
