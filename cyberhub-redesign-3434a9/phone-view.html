<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Phone view | CyberHub preview</title>
<link rel="stylesheet" href="shared/base.css">
<style>
body{--bg:#0a0d13;--fg:#f1f3ee;--muted:#a9afba;--line:rgba(255,255,255,.12);--focus:#c6f432;--link:#c6f432}
.w{padding:24px 20px 48px;max-width:1400px;margin:0 auto}
h1{font-size:1.6rem}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.jump a{color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;font-size:.9rem}
.row{display:flex;gap:18px;flex-wrap:wrap}
figure{margin:0}
figcaption{font-weight:600;margin-bottom:8px;font-size:.95rem}
.ph{width:300px;height:631px;border:8px solid #222;border-radius:36px;overflow:hidden;background:#000}
.ph{position:relative}
.ph iframe{position:absolute;top:0;left:0;display:block;width:390px;height:844px;min-height:844px;max-height:none;border:0;transform:scale(.7282);transform-origin:0 0}
</style>
</head>
<body>
<main class="w">
  <h1>All 4 directions at iPhone size</h1>
  <p class="muted">Each frame is a real 390-pixel-wide phone screen. Scroll inside a frame, or jump to a section:</p>
  <nav class="jump" aria-label="Jump every frame to a section">
    <a href="?at=top">Top</a><a href="?at=work">Work</a><a href="?at=how">How it works</a><a href="?at=pricing">Pricing</a><a href="?at=faq">FAQ</a><a href="?at=apps">Apps</a><a href="?at=contact">Contact</a><a href="./">Back to all 4</a>
  </nav>
  <div class="row">
    <figure><figcaption>1 &middot; Clear Line</figcaption><div class="ph"><iframe data-src="1-clear-line.html" title="Clear Line at phone size"></iframe></div></figure>
    <figure><figcaption>2 &middot; Power On</figcaption><div class="ph"><iframe data-src="2-power-on.html" title="Power On at phone size"></iframe></div></figure>
    <figure><figcaption>3 &middot; Roots Up</figcaption><div class="ph"><iframe data-src="3-roots-up.html" title="Roots Up at phone size"></iframe></div></figure>
    <figure><figcaption>4 &middot; Glass Hub</figcaption><div class="ph"><iframe data-src="4-glass-hub.html" title="Glass Hub at phone size"></iframe></div></figure>
  </div>
</main>
<script>
(function(){var m=/[?&]at=([a-z]+)/.exec(location.search),at=m?m[1]:'top';
document.querySelectorAll('iframe').forEach(function(f){f.src=f.getAttribute('data-src')+'?static'+(at==='top'?'':'#'+at)})})();
</script>
</body>
</html>
